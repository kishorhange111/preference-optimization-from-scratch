[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preference-optimization-from-scratch"
version = "0.1.0"
description = "DPO, conservative DPO, IPO and SimPO from their papers, compared on controlled-sentiment generation with a known reward: reward vs KL, preference accuracy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
dependencies = ["torch>=2.2", "numpy>=1.26", "transformers>=4.40", "datasets>=2.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "E731"]
